name: Feature request
description: Suggest something new for 161
title: "[Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, please search the open requests. If yours is already there, add a 👍 to it instead.
  - type: textarea
    id: idea
    attributes:
      label: What would you like 161 to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to do in your homelab? The problem helps more than the solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or other apps that do this well?
  - type: input
    id: app-version
    attributes:
      label: 161 version
      placeholder: "2.0"
