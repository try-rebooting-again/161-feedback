name: Bug report
description: Something in 161 isn't working right
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Please don't include passwords, API keys or server addresses.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
      placeholder: When I tap the SABnzbd button, the status says "Can't reach"…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Management
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 161 version
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "15"
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: Pixel 9
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help. Blur out any addresses or passwords first.
